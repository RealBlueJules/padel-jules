<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎾 Tennis for Two - PC & Mobile Crossplay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Courier New', monospace; color: #fff;
            overflow: hidden; touch-action: none; overscroll-behavior: none;
        }
        .game-container {
            background: #111128; padding: 15px; border-radius: 20px;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.1);
            border: 1px solid #00ccff44; text-align: center; position: relative;
            width: 100%; max-width: 900px;
        }
        
        .settings-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding: 8px 15px; background: #0f0f2a;
            border-radius: 12px; border: 1px solid #00ccff44; flex-wrap: wrap; gap: 10px;
        }
        select, input[type="checkbox"] {
            background: #1a1a3e; color: #00ccff; border: 1px solid #00ccff66;
            padding: 5px 10px; border-radius: 5px; font-family: 'Courier New', monospace;
            cursor: pointer; outline: none; font-size: 0.9rem;
        }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #88ddff; cursor: pointer; }

        canvas {
            display: block; margin: 0 auto; border-radius: 12px;
            background-color: #0f1a2f; background-size: cover; background-position: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.7);
            
            width: auto; max-width: 100%; max-height: 65vh; aspect-ratio: 2 / 1;
            
            cursor: default; touch-action: none; transition: background-image 0.3s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        
        .controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; padding: 10px 18px; background: #0f0f2a;
            border-radius: 50px; border: 1px solid #00ccff44; flex-wrap: wrap; gap: 10px;
        }
        .controls div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .key {
            background: #1a1a3e; padding: 4px 10px; border-radius: 30px;
            border: 1px solid #00ccff66; color: #00ccff; font-weight: bold; font-size: 0.75rem;
        }
        .score { font-size: 1.6rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px #00ccff; letter-spacing: 3px; }
        .btn {
            background: #00ccff; border: none; color: #0a0a1a; padding: 8px 20px;
            border-radius: 40px; font-weight: bold; cursor: pointer; transition: 0.3s;
            font-size: 0.95rem; font-family: 'Courier New', monospace;
        }
        .btn-hidden { visibility: hidden; pointer-events: none; }
        .stats { position: absolute; top: -25px; left: 15px; font-size: 0.8rem; color: #6699bb; }
        
        @media (max-height: 500px) {
            .game-container { padding: 5px; border-radius: 10px; }
            .settings-bar, .controls { padding: 4px 10px; margin: 4px 0; border-radius: 8px; }
            canvas { max-height: 60vh; }
            .stats { display: none; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats" id="statsDisplay">Victorias - J1: 0 | J2/IA: 0</div>
    
    <div class="settings-bar">
        <div>
            <select id="stageSelect">
                <option value="canchajusto.jpg">Justo Sierra</option>
                <option value="canchaazul.jpg">Cancha Azul</option>
                <option value="none">Neón Clásico</option>
            </select>
        </div>
        <label class="checkbox-label">
            <input type="checkbox" id="musicToggle" checked>🎵 Música
        </label>
        <button class="btn" id="fullscreenBtn" style="padding: 4px 12px; font-size: 0.8rem;">[ ] Fullscreen</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="controls">
        <div>
            <span class="key">W / S</span>
            <span style="color:#aaa; font-size: 0.8rem;">J1 (Toque Izq)</span>
        </div>
        <div class="score" id="scoreDisplay">0 - 0</div>
        <button class="btn" id="resetBtn">⟳ Reiniciar</button>
        <div>
            <span style="color:#aaa; font-size: 0.8rem;">J2 (Toque Der)</span>
            <span class="key">⬆ / ⬇</span>
        </div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const resetBtn = document.getElementById('resetBtn');
        const statsDisplay = document.getElementById('statsDisplay');
        const stageSelect = document.getElementById('stageSelect');
        const musicToggle = document.getElementById('musicToggle');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        fullscreenBtn.addEventListener('click', () => {
            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen().catch(e => console.log(e));
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        });

        const bgMusic = new Audio('electricsoundtrack.mp3');
        bgMusic.loop = true; bgMusic.volume = 0.5;

        musicToggle.addEventListener('change', (e) => {
            if (e.target.checked && game.started) bgMusic.play().catch(e=>console.log(e));
            else bgMusic.pause();
        });

        function updateBackground() { canvas.style.backgroundImage = stageSelect.value === 'none' ? 'none' : `url('${stageSelect.value}')`; }
        stageSelect.addEventListener('change', updateBackground); updateBackground();

        let audioCtx;
        function playSound(type) {
            if (!audioCtx) return;
            
            if (type === 'cheer') {
                const bufferSize = audioCtx.sampleRate * 1.5; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 600;
                
                const gain = audioCtx.createGain();
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                
                noise.start(); return; 
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'score') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const CONFIG = {
            width: 800, height: 400, paddleWidth: 12, paddleHeight: 70,
            ballRadius: 8, ballSpeed: 7.0, maxSpeed: 15.0, speedIncrement: 0.5, winningScore: 7
        };

        let stats = { j1: 0, j2: 0 };
        if(localStorage.getItem('tennisStats')) stats = JSON.parse(localStorage.getItem('tennisStats'));
        function updateStatsDisplay() { statsDisplay.textContent = `Victorias - J1: ${stats.j1} | J2/IA: ${stats.j2}`; }
        updateStatsDisplay();

        // --- SISTEMA HÍBRIDO PC/MÓVIL ---
        // Rastreamos si el jugador está tocando la pantalla para anular el teclado solo en ese momento
        let game = {
            paddle1: { x: 20, y: 0, dy: 0, score: 0 },
            paddle2: { x: 0, y: 0, dy: 0, score: 0 },
            ball: { x: 0, y: 0, dx: 0, dy: 0, speed: CONFIG.ballSpeed },
            ballTrail: [], running: false, winner: null, started: false, showReset: false,
            countdown: 3, countdownActive: false, countdownTimer: 0, firstStart: true,
            paused: false, vsCPU: false, shakeTimer: 0, celebrateTimer: 0,
            touchingP1: false, touchingP2: false // Banderas de control táctil
        };

        const keys = { w: false, s: false, arrowup: false, arrowdown: false };

        let spectators = [];
        const specColors = ['#00ccff', '#ff8a80', '#ffffff', '#ffee00', '#aa00ff'];
        for(let i=0; i<120; i++) {
            spectators.push({
                x: 40 + Math.random() * (CONFIG.width - 80),
                y: Math.random() > 0.5 ? 5 + Math.random()*15 : CONFIG.height - 20 + Math.random()*15,
                color: specColors[Math.floor(Math.random() * specColors.length)], offset: Math.random() * Math.PI * 2 
            });
        }

        let particles = [];
        function spawnParticles(x, y, dxDirection, baseColor) {
            for(let i=0; i<15; i++) particles.push({ x: x, y: y, vx: dxDirection * (Math.random() * 3 + 1), vy: (Math.random() - 0.5) * 6, life: 1.0, color: baseColor });
        }

        function resetPositions() {
            game.paddle1.y = CONFIG.height/2 - CONFIG.paddleHeight/2;
            game.paddle2.y = CONFIG.height/2 - CONFIG.paddleHeight/2;
            game.paddle2.x = CONFIG.width - 20 - CONFIG.paddleWidth;
            game.paddle1.dy = 0; game.paddle2.dy = 0;
            
            game.ball.x = CONFIG.width/2; game.ball.y = CONFIG.height/2;
            const angle = (Math.random() * 0.8 + 0.2) * (Math.random() > 0.5 ? 1 : -1);
            game.ball.dx = Math.cos(angle) * CONFIG.ballSpeed; game.ball.dy = Math.sin(angle) * CONFIG.ballSpeed;
            game.ball.speed = CONFIG.ballSpeed;
            
            game.ballTrail = []; game.winner = null; game.running = false; particles = [];
        }

        function resetGame() {
            game.paddle1.score = 0; game.paddle2.score = 0;
            game.started = false; game.running = false; game.winner = null; game.showReset = false; game.paused = false;
            game.countdown = 3; game.countdownActive = false; game.firstStart = true;
            resetPositions(); updateScoreDisplay(); updateResetButton();
        }

        function startGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (musicToggle.checked && bgMusic.paused) bgMusic.play().catch(e=>console.log(e));

            if (!game.started) {
                game.started = true; game.showReset = true;
                if (game.firstStart) {
                    game.countdown = 3; game.countdownActive = true; game.running = false; game.countdownTimer = 60; game.firstStart = false;
                } else resumeAfterPoint();
                updateScoreDisplay(); updateResetButton();
            }
        }

        function resumeAfterPoint() {
            resetPositions(); game.running = true;
            const angle = (Math.random() * 0.8 + 0.2) * (Math.random() > 0.5 ? 1 : -1);
            game.ball.dx = Math.cos(angle) * CONFIG.ballSpeed * (Math.random() > 0.5 ? 1 : -1);
            game.ball.dy = Math.sin(angle) * CONFIG.ballSpeed; game.ball.speed = CONFIG.ballSpeed;
        }

        function updateScoreDisplay() { scoreDisplay.textContent = `${game.paddle1.score} - ${game.paddle2.score}`; }
        function updateResetButton() {
            if (game.showReset && game.started) resetBtn.classList.remove('btn-hidden');
            else resetBtn.classList.add('btn-hidden');
        }

        function drawStartScreen() {
            ctx.fillStyle = 'rgba(10, 10, 30, 0.85)'; ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 40;
            ctx.font = 'bold 52px "Courier New", monospace'; ctx.fillStyle = '#ffffff';
            ctx.fillText('🎾 TENNIS FOR TWO', CONFIG.width/2, CONFIG.height/2 - 90);

            ctx.shadowBlur = 15; ctx.font = '18px "Courier New", monospace'; ctx.fillStyle = '#88ddff';
            ctx.fillText('Toque / Click o [Espacio] para iniciar', CONFIG.width/2, CONFIG.height/2 - 20);

            ctx.shadowBlur = 0;
            const modeBtnY = CONFIG.height/2 + 30;
            ctx.fillStyle = game.vsCPU ? '#ff8a80' : '#1a1a3e'; ctx.strokeStyle = game.vsCPU ? '#ff8a80' : '#00ccff66';
            ctx.beginPath(); ctx.roundRect(CONFIG.width/2 - 100, modeBtnY, 200, 40, 20); ctx.fill(); ctx.stroke();
            ctx.fillStyle = game.vsCPU ? '#111' : '#00ccff'; ctx.font = 'bold 16px "Courier New"';
            ctx.fillText(game.vsCPU ? '🤖 VS CPU' : '👥 2 JUGADORES', CONFIG.width/2, modeBtnY + 20);

            const btnX = CONFIG.width/2 - 80, btnY = CONFIG.height/2 + 100;
            ctx.shadowBlur = 30; ctx.shadowColor = '#00ccff'; ctx.fillStyle = '#00ccff';
            ctx.beginPath(); ctx.roundRect(btnX, btnY, 160, 50, 30); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = '#0a0a1a'; ctx.font = 'bold 24px "Courier New"';
            ctx.fillText('▶️ INICIAR', CONFIG.width/2, btnY + 25);
        }

        function handleCanvasClick(e) {
            if (game.started) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if(!clientX) return;
            const mouseX = (clientX - rect.left) * scaleX, mouseY = (clientY - rect.top) * scaleY;

            if (mouseX >= CONFIG.width/2 - 80 && mouseX <= CONFIG.width/2 + 80 && mouseY >= CONFIG.height/2 + 100 && mouseY <= CONFIG.height/2 + 150) startGame();
            if (mouseX >= CONFIG.width/2 - 100 && mouseX <= CONFIG.width/2 + 100 && mouseY >= CONFIG.height/2 + 30 && mouseY <= CONFIG.height/2 + 70) game.vsCPU = !game.vsCPU;
        }

        function draw() {
            ctx.save();
            if (game.shakeTimer > 0) { ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12); game.shakeTimer--; }
            ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);
            
            spectators.forEach((s) => {
                let jumpY = 0; let drawColor = s.color;
                if (game.celebrateTimer > 0) {
                    const direction = s.y < CONFIG.height/2 ? 1 : -1;
                    jumpY = (Math.random() * 15) * direction; 
                    if (Math.random() > 0.85) drawColor = '#ffffff'; 
                } else jumpY = Math.sin((Date.now() / 400) + s.offset) * 3;
                
                ctx.fillStyle = drawColor; ctx.globalAlpha = 0.5 + Math.random() * 0.5;
                ctx.beginPath(); ctx.arc(s.x, s.y + jumpY, 2, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.setLineDash([8, 12]);
            ctx.beginPath(); ctx.moveTo(CONFIG.width/2, 0); ctx.lineTo(CONFIG.width/2, CONFIG.height); ctx.stroke();
            ctx.setLineDash([]); ctx.beginPath(); ctx.arc(CONFIG.width/2, CONFIG.height/2, 60, 0, Math.PI*2); ctx.stroke();

            if (!game.started) { ctx.restore(); drawStartScreen(); return; }

            const ratio = (game.ball.speed - CONFIG.ballSpeed) / (CONFIG.maxSpeed - CONFIG.ballSpeed);
            const ballColor = ratio < 0.3 ? '#ffffff' : ratio < 0.6 ? '#ffee00' : ratio < 0.9 ? '#ff8800' : '#ff2200';

            game.ballTrail.forEach((pos, index) => {
                const alpha = (index + 1) / game.ballTrail.length;
                ctx.globalAlpha = alpha * 0.4; ctx.fillStyle = ballColor;
                ctx.beginPath(); ctx.arc(pos.x, pos.y, CONFIG.ballRadius * (0.5 + (alpha * 0.5)), 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.shadowBlur = 18; ctx.shadowColor = '#4fc3f7'; ctx.fillStyle = '#4fc3f7';
            ctx.fillRect(game.paddle1.x, game.paddle1.y, CONFIG.paddleWidth, CONFIG.paddleHeight);

            ctx.shadowColor = '#ff8a80'; ctx.fillStyle = '#ff8a80';
            ctx.fillRect(game.paddle2.x, game.paddle2.y, CONFIG.paddleWidth, CONFIG.paddleHeight);

            ctx.shadowColor = ballColor; ctx.shadowBlur = 30; ctx.fillStyle = ballColor;
            ctx.beginPath(); ctx.arc(game.ball.x, game.ball.y, CONFIG.ballRadius, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            if (game.countdownActive) {
                ctx.fillStyle = 'rgba(10, 10, 30, 0.7)'; ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowBlur = 60; ctx.shadowColor = '#00ccff';
                ctx.font = 'bold 120px "Courier New"'; ctx.fillStyle = '#ffffff';
                let text = game.countdown > 0 ? game.countdown.toString() : '¡YA!';
                if (game.countdown === 0) { ctx.font = 'bold 80px "Courier New"'; ctx.fillStyle = '#00ff88'; }
                ctx.fillText(text, CONFIG.width/2, CONFIG.height/2 - 10); ctx.shadowBlur = 0;
            }

            if (game.winner) {
                ctx.shadowBlur = 40; ctx.shadowColor = '#00ccff'; ctx.textAlign = 'center';
                ctx.font = 'bold 40px "Courier New"'; ctx.fillStyle = '#ffffff';
                const msg = game.winner === 'player1' ? '🏆 J1 GANA' : (game.vsCPU ? '🏆 CPU GANA' : '🏆 J2 GANA');
                ctx.fillText(msg, CONFIG.width/2, CONFIG.height/2 - 20);
                ctx.shadowBlur = 0; ctx.font = '18px "Courier New"'; ctx.fillStyle = '#aaa';
                ctx.fillText('Presiona "Reiniciar"', CONFIG.width/2, CONFIG.height/2 + 40);
            }
            ctx.restore();
        }

        function update() {
            if (game.countdownActive) {
                if (game.countdownTimer-- <= 0) {
                    game.countdown--; game.countdownTimer = 60;
                    if (game.countdown < 0) { game.countdownActive = false; game.running = true; game.countdown = 3; resumeAfterPoint(); }
                }
                return;
            }

            if (game.celebrateTimer > 0) game.celebrateTimer--;
            if (!game.running || game.winner || !game.started || game.paused) return;

            const p1 = game.paddle1, p2 = game.paddle2, ball = game.ball;
            game.ballTrail.push({x: ball.x, y: ball.y});
            if (game.ballTrail.length > 8) game.ballTrail.shift();

            // --- LÓGICA DE MOVIMIENTO HÍBRIDA (Teclado + Touch) ---
            if (!game.touchingP1) {
                if (keys.w) p1.dy = -7; else if (keys.s) p1.dy = 7; else p1.dy = 0;
                p1.y += p1.dy;
            }
            p1.y = Math.max(0, Math.min(CONFIG.height - CONFIG.paddleHeight, p1.y));

            if (game.vsCPU) {
                const oldY = p2.y;
                if (ball.dx > 0) p2.y += ((ball.y - CONFIG.paddleHeight/2) - p2.y) * 0.09;
                else p2.y += ((CONFIG.height/2 - CONFIG.paddleHeight/2) - p2.y) * 0.02;
                p2.dy = p2.y - oldY; // IA spin effect
            } else {
                if (!game.touchingP2) {
                    if (keys.arrowup) p2.dy = -7; else if (keys.arrowdown) p2.dy = 7; else p2.dy = 0;
                    p2.y += p2.dy;
                }
            }
            p2.y = Math.max(0, Math.min(CONFIG.height - CONFIG.paddleHeight, p2.y));

            ball.x += ball.dx; ball.y += ball.dy;

            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].life -= 0.05;
                if(particles[i].life <= 0) particles.splice(i, 1);
            }

            if (ball.y - CONFIG.ballRadius < 0 || ball.y + CONFIG.ballRadius > CONFIG.height) {
                ball.dy = -ball.dy; ball.y = ball.y - CONFIG.ballRadius < 0 ? CONFIG.ballRadius : CONFIG.height - CONFIG.ballRadius;
                playSound('hit');
            }

            if (ball.dx < 0 && ball.x - CONFIG.ballRadius < p1.x + CONFIG.paddleWidth && ball.x + CONFIG.ballRadius > p1.x && ball.y > p1.y && ball.y < p1.y + CONFIG.paddleHeight) {
                playSound('hit'); spawnParticles(ball.x, ball.y, 1, '#4fc3f7');
                const hitPos = (ball.y - (p1.y + CONFIG.paddleHeight/2)) / (CONFIG.paddleHeight/2);
                ball.speed = Math.min(ball.speed + CONFIG.speedIncrement, CONFIG.maxSpeed);
                ball.dx = Math.cos(hitPos * Math.PI / 3.5) * ball.speed; ball.dy = (Math.sin(hitPos * Math.PI / 3.5) * ball.speed) + (p1.dy * 0.25);
                if (ball.dx < 0) ball.dx = -ball.dx; ball.x = p1.x + CONFIG.paddleWidth + CONFIG.ballRadius + 1;
            }

            if (ball.dx > 0 && ball.x + CONFIG.ballRadius > p2.x && ball.x - CONFIG.ballRadius < p2.x + CONFIG.paddleWidth && ball.y > p2.y && ball.y < p2.y + CONFIG.paddleHeight) {
                playSound('hit'); spawnParticles(ball.x, ball.y, -1, '#ff8a80');
                const hitPos = (ball.y - (p2.y + CONFIG.paddleHeight/2)) / (CONFIG.paddleHeight/2);
                ball.speed = Math.min(ball.speed + CONFIG.speedIncrement, CONFIG.maxSpeed);
                ball.dx = -Math.cos(hitPos * Math.PI / 3.5) * ball.speed; ball.dy = (Math.sin(hitPos * Math.PI / 3.5) * ball.speed) + (p2.dy * 0.25);
                if (ball.dx > 0) ball.dx = -ball.dx; ball.x = p2.x - CONFIG.ballRadius - 1;
            }

            if (ball.x - CONFIG.ballRadius < -20 || ball.x + CONFIG.ballRadius > CONFIG.width + 20) {
                playSound('score'); playSound('cheer'); 
                game.shakeTimer = 15; game.celebrateTimer = 90; 
                
                if (ball.x < 0) p2.score++; else p1.score++;
                updateScoreDisplay();
                if (p1.score >= CONFIG.winningScore || p2.score >= CONFIG.winningScore) {
                    game.winner = p1.score >= CONFIG.winningScore ? 'player1' : 'player2'; game.running = false;
                    game.celebrateTimer = 200; 
                    if (game.winner === 'player1') stats.j1++; else stats.j2++;
                    localStorage.setItem('tennisStats', JSON.stringify(stats)); updateStatsDisplay();
                } else resumeAfterPoint();
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

        // --- MANEJADORES DE TECLADO REINTEGRADOS ---
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w','s','arrowup','arrowdown',' ','enter','p','escape'].includes(key)) e.preventDefault();
            if ((key === 'p' || key === 'escape') && game.started && !game.winner && !game.countdownActive) {
                game.paused = !game.paused; return;
            }
            if ((key === ' ' || key === 'enter') && !game.started) { startGame(); return; }
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        // --- MANEJADORES TÁCTILES ---
        function handleTouches(e) {
            if (e.type !== 'touchend') e.preventDefault(); 
            if (!game.running || game.paused) return;
            const rect = canvas.getBoundingClientRect();
            const scaleY = CONFIG.height / rect.height, scaleX = CONFIG.width / rect.width;
            
            game.touchingP1 = false; 
            game.touchingP2 = false;

            for(let i=0; i < e.touches.length; i++) {
                const t = e.touches[i], x = (t.clientX - rect.left) * scaleX, targetY = (t.clientY - rect.top) * scaleY - (CONFIG.paddleHeight/2);
                if (x < CONFIG.width / 2) {
                    game.touchingP1 = true; game.paddle1.dy = Math.max(-10, Math.min(10, targetY - game.paddle1.y)); game.paddle1.y = targetY;
                } else if (!game.vsCPU && x >= CONFIG.width / 2) {
                    game.touchingP2 = true; game.paddle2.dy = Math.max(-10, Math.min(10, targetY - game.paddle2.y)); game.paddle2.y = targetY;
                }
            }
            if (!game.touchingP1) game.paddle1.dy = 0; 
            if (!game.touchingP2 && !game.vsCPU) game.paddle2.dy = 0;
        }

        canvas.addEventListener('touchstart', handleTouches, { passive: false });
        canvas.addEventListener('touchmove', handleTouches, { passive: false });
        canvas.addEventListener('touchend', handleTouches, { passive: false });
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', (e) => { if (!game.started) handleCanvasClick(e); }, { passive: false });
        resetBtn.addEventListener('click', () => { resetGame(); updateResetButton(); });

        resetPositions(); updateScoreDisplay(); gameLoop();
        
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r=0) {
                this.moveTo(x+r, y); this.arcTo(x+w, y, x+w, y+h, r); this.arcTo(x+w, y+h, x, y+h, r);
                this.arcTo(x, y+h, x, y, r); this.arcTo(x, y, x+w, y, r); return this;
            };
        }
    })();
</script>
</body>
